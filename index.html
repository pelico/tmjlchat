<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>家庭传声筒 (云端版)</title>
    <style>
        :root { --primary: #07c160; --bg: #f5f5f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        #login-overlay { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 80%; margin-bottom: 15px; font-size: 18px; }
        .login-btn { padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; width: 80%; font-weight: bold; font-size: 18px; }
        #header { padding: 15px; text-align: center; background: #ededed; border-bottom: 1px solid #ddd; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 16px; word-break: break-all; }
        .message.dad { align-self: flex-end; background: #95ec69; }
        .message.kid { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
        #input-area { padding: 10px; background: #f7f7f7; display: flex; gap: 8px; border-top: 1px solid #ddd; align-items: center; }
        #person-select { padding: 0 10px; height: 40px; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
        #msg-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; background: #fff; height: 40px; outline: none; }
        #send-btn { background: var(--primary); color: #fff; border: none; padding: 0 15px; border-radius: 6px; font-weight: bold; height: 40px; width: 70px;}
    </style>
</head>
<body>
    <div id="login-overlay">
        <h2>🔒 云端验证</h2><br>
        <input type="password" id="pwd-input" class="login-input" placeholder="密码">
        <button onclick="doLogin()" class="login-btn">进入</button>
    </div>
    <div id="header">小代说 (Serverless) <span onclick="clearHistory()" style="font-size:12px;color:#999;float:right">清空</span></div>
    <div id="chat-box"></div>
    <div id="input-area">
        <select id="person-select"><option value="">(直接发)</option><option value="悠悠">悠悠</option><option value="玥玥">玥玥</option><option value="老婆">老婆</option></select>
        <input type="text" id="msg-input" placeholder="输入消息...">
        <button onclick="sendMsg()" id="send-btn">发送</button>
    </div>
    <script>
        // 🔴 你的 Worker 地址 (不要填 Pages 的地址，要填 Worker 的！)
        // 格式: https://tm-api.111312.xyz (后面不要带斜杠)
        const API_URL = "https://tm-api.111312.xyz"; 
        
        let userPwd = localStorage.getItem("pwd") || "";

        if(userPwd) { document.getElementById('login-overlay').classList.add('hidden'); startPolling(); }

        function doLogin() {
            userPwd = document.getElementById('pwd-input').value;
            localStorage.setItem("pwd", userPwd);
            document.getElementById('login-overlay').classList.add('hidden');
            startPolling();
        }

        function startPolling() { loadHistory(); setInterval(loadHistory, 3000); }
        
        function loadHistory() {
            fetch(API_URL + '/history').then(r=>r.json()).then(data => {
                const box = document.getElementById('chat-box');
                if (box.children.length === data.length) return;
                box.innerHTML = '';
                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message ' + msg.role;
                    div.innerText = msg.text;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        async function sendMsg() {
            const input = document.getElementById('msg-input');
            const select = document.getElementById('person-select');
            let rawText = input.value.trim();
            if (!rawText) return;
            
            let finalMsg = select.value ? select.value + "，" + rawText : rawText;
            const btn = document.getElementById('send-btn');
            btn.disabled = true;

            try {
                await fetch(API_URL + '/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: userPwd, text: finalMsg})
                });
                input.value = '';
                loadHistory();
            } catch (e) { alert("发送失败: " + e); } 
            finally { btn.disabled = false; }
        }
        
        function clearHistory() {
            if(confirm("确定清空吗？")) fetch(API_URL + '/clear', {method:'POST'});
        }
    </script>
</body>
</html>
